plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.teplayakompaniya.tk4'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.teplayakompaniya.tk4'
        minSdk 26
        targetSdk 34
        versionCode 603002
        versionName '6.3.1-connected'
        testInstrumentationRunner 'ru.teplayakompaniya.tk4.Stage1Smoke'
        manifestPlaceholders = [appName: 'Тёплая Компания 4.0']
    }

    buildTypes {
        debug {
            debuggable true
        }
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            manifestPlaceholders = [appName: 'Тёплая Компания 4.0 QA']
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
