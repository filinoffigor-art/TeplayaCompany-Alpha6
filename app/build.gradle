plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.teplayakompaniya.tk4'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.teplayakompaniya.tk4'
        minSdk 26
        targetSdk 34
        versionCode 605003
        versionName '6.5.3-parent'
        testInstrumentationRunner 'ru.teplayakompaniya.tk4.Stage1Smoke'
    }

    signingConfigs {
        parent {
            storeFile file('tk4-parent.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.parent
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
