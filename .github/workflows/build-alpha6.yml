name: Build TK4 Stage 1
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [ main, codex/stage1 ]
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-alpha6.yml', 'scripts/**', 'backend/**' ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        run: |
          curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
      - name: Restore persistent parent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tk4-parent-signing-v1
      - name: Initialize persistent parent signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=TK4 Parent, O=TeplayaCompany, C=RU" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Static contracts
        run: |
          grep -q "applicationId 'ru.teplayakompaniya.tk4'" app/build.gradle
          grep -q "versionCode 604000" app/build.gradle
          grep -q 'AKfycbwoAeJf7fPZDGvteBsjrver2RhPGfooZdFZn' app/src/main/java/ru/teplayakompaniya/tk4/ApiClient.java
          if grep -R 'WebView\|Log\.\|System.out.print' app/src/main/java; then exit 1; fi
      - name: Backend and migration contracts
        run: |
          node scripts/operational-api-test.cjs
          python3 scripts/test-normalize-september.py
      - name: Compile, unit tests, lint and APKs
        run: ./gradle-8.11.1/bin/gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --stacktrace
      - name: Build baseline with the same CI key for data migration test
        run: |
          mkdir baseline
          git archive 4ee39e807acdf085113c9204db46e28dce008737 | tar -x -C baseline
          ./gradle-8.11.1/bin/gradle -p baseline assembleDebug --no-daemon
      - name: Record stable parent signing certificate
        id: compatibility
        run: |
          mkdir -p delivery qa
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          current=$($signer verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest')
          echo "$current" | tee delivery/PARENT_CERTIFICATE.txt
          echo 'artifact=TeplayaCompany-v6.4.0-STABLE-PARENT' >> "$GITHUB_OUTPUT"
          echo 'STABLE PARENT INSTALLATION. Keep this app installed. Future updates are signed with this persistent parent key and must be installed over this app.' > delivery/COMPATIBILITY.txt
          cp app/build/outputs/apk/debug/app-debug.apk delivery/TeplayaCompany-v6.4.0-stable-parent.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/TeplayaCompany-v6.4.0-parent-unsigned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator QA at 412 x 915 dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/stage1-emulator.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compatibility.outputs.artifact }}
          path: delivery/
          retention-days: 30
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage1-QA-evidence
          path: |
            qa/
            app/build/reports/
          retention-days: 30
