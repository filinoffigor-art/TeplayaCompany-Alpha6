name: Build TK4 Stage 1
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/stage1 ]
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build-alpha6.yml', 'scripts/**', 'backend/**' ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        run: |
          curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
      - name: Restore original debug key if provided
        env:
          ORIGINAL_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ORIGINAL_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ORIGINAL_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Static contracts
        run: |
          grep -q "applicationId 'ru.teplayakompaniya.tk4'" app/build.gradle
          grep -q "versionCode 603002" app/build.gradle
          grep -q 'AKfycbwoAeJf7fPZDGvteBsjrver2RhPGfooZdFZn' app/src/main/java/ru/teplayakompaniya/tk4/ApiClient.java
          if grep -R 'WebView\|Log\.\|System.out.print' app/src/main/java; then exit 1; fi
      - name: Backend and migration contracts
        run: |
          node scripts/operational-api-test.cjs
          python3 scripts/test-normalize-september.py
      - name: Compile, unit tests, lint and APKs
        run: ./gradle-8.11.1/bin/gradle testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon --stacktrace
      - name: Build baseline with the same CI key for data migration test
        run: |
          mkdir baseline
          git archive 4ee39e807acdf085113c9204db46e28dce008737 | tar -x -C baseline
          ./gradle-8.11.1/bin/gradle -p baseline assembleDebug --no-daemon
      - name: Download actual previous APK for certificate comparison
        id: previous
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: TeplayaCompany-v6.1.0-alpha6.1
          path: previous-apk
          run-id: 35093487753
          github-token: ${{ github.token }}
      - name: Classify APK compatibility
        id: compatibility
        run: |
          mkdir -p delivery qa
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          current=$($signer verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest')
          previous_file=$(find previous-apk -name '*.apk' -print -quit 2>/dev/null || true)
          previous=''
          if [ -n "$previous_file" ]; then previous=$($signer verify --print-certs "$previous_file" | grep 'certificate SHA-256 digest'); fi
          if [ -n "$previous" ] && [ "$current" = "$previous" ]; then
            echo 'artifact=TeplayaCompany-v6.3.1-connected-compatible' >> "$GITHUB_OUTPUT"
            echo 'Certificate matches Alpha 6.1; original APK update still requires device validation.' > delivery/COMPATIBILITY.txt
          else
            echo 'artifact=TeplayaCompany-v6.3.1-connected-QA-ONLY' >> "$GITHUB_OUTPUT"
            echo 'NOT AN UPDATE FOR THE INSTALLED ALPHA. Original signing key is unavailable or does not match. Do not uninstall the current app. Data migration test uses a baseline rebuilt with the same CI key; it does not prove compatibility with the original APK.' > delivery/COMPATIBILITY.txt
          fi
          cp app/build/outputs/apk/debug/app-debug.apk delivery/TeplayaCompany-v6.3.1-connected.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk delivery/TeplayaCompany-v6.3.1-connected-unsigned.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator QA at 412 x 915 dp
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/stage1-emulator.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compatibility.outputs.artifact }}
          path: delivery/
          retention-days: 30
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stage1-QA-evidence
          path: |
            qa/
            app/build/reports/
          retention-days: 30
